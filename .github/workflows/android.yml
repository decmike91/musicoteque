# Compile l'application Android « Musicothèque Télécommande » et la publie dans Releases.
name: Application Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilation
        run: gradle -p android assembleDebug --no-daemon
      - name: Renommage
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Musicotheque-Telecommande.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Musicotheque-Telecommande
          path: Musicotheque-Telecommande.apk
      - name: Publication (onglet Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: telecommande-v${{ github.run_number }}
          name: Télécommande Android v${{ github.run_number }}
          body: |
            Application Android de télécommande pour Musicothèque (version Raspberry Pi).
            Sur le téléphone : téléchargez **Musicotheque-Telecommande.apk**, ouvrez-le et autorisez l'installation.
          files: Musicotheque-Telecommande.apk
