plugins {
    id 'com.android.application'
}

android {
    namespace 'fr.musicotheque.remote'
    compileSdk 34

    defaultConfig {
        applicationId 'fr.musicotheque.remote'
        minSdk 24          // Android 7 et plus
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
